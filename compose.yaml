# This is a local development database; no Docker requirement for production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cpp_taskapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cpp_taskapp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
